/* ===================== 预渲染发光精灵（高斯柔光） ===================== */
// 用高斯衰减生成柔和无硬边的光斑 —— 拒绝"盐粒感"，每个粒子都是一团柔光。
function makeSoft(rgb, size, sigma){
  size=size||128; sigma=sigma||0.33;
  const cv=document.createElement('canvas'); cv.width=cv.height=size;
  const c=cv.getContext('2d'); const m=size/2;
  const grd=c.createRadialGradient(m,m,0,m,m,m);
  const N=12;
  for(let i=0;i<=N;i++){
    const r=i/N;
    // 高斯衰减 × 边缘强制归零（1-r²）→ 丝滑过渡且绝无矩形硬边
    const a=Math.exp(-(r*r)/(2*sigma*sigma))*(1-r*r);
    grd.addColorStop(r,'rgba('+rgb+','+a.toFixed(4)+')');
  }
  c.fillStyle=grd; c.fillRect(0,0,size,size);
  return cv;
}
function makeCross(size){
  size=size||128; const cv=document.createElement('canvas'); cv.width=cv.height=size;
  const c=cv.getContext('2d'); const m=size/2, w=1.6;
  const beam=(h)=>{
    const lg=h?c.createLinearGradient(0,0,size,0):c.createLinearGradient(0,0,0,size);
    lg.addColorStop(0,'rgba(255,255,255,0)');
    lg.addColorStop(0.5,'rgba(240,248,255,0.82)');
    lg.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=lg;
    if(h) c.fillRect(0,m-w,size,w*2); else c.fillRect(m-w,0,w*2,size);
  };
  beam(false); beam(true);
  const cg=c.createRadialGradient(m,m,0,m,m,m*0.6);
  cg.addColorStop(0,'rgba(255,255,255,0.95)');
  cg.addColorStop(1,'rgba(220,235,255,0)');
  c.fillStyle=cg; c.beginPath(); c.arc(m,m,m*0.6,0,6.283185); c.fill();
  return cv;
}

  c.fillText(ch, m, m+size*0.02);

  c.fillText(ch, m, m+size*0.02);

}
const glyphPink=makeGlyph('慧',256,{f:'rgba(255,235,245,0.97)',sh:'rgba(255,200,225,0.95)',halo0:'rgba(255,210,232,0.50)',halo1:'rgba(255,200,225,0.13)'});
const glyphIce =makeGlyph('慧',256,{f:'rgba(220,240,255,0.97)',sh:'rgba(160,205,255,0.95)',halo0:'rgba(190,225,255,0.50)',halo1:'rgba(160,205,255,0.13)'});

/* ===================== 形状采样 ===================== */
function sampleHeart(n){
  const FINE=2048, raw=[];
  for(let i=0;i<FINE;i++){
    const t=Math.PI*2*i/FINE;
    const x=16*Math.pow(Math.sin(t),3);
    const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    raw.push([x,-y]);
  }
  const cum=[0];
  for(let i=1;i<=FINE;i++){
    const a=raw[i-1], b=raw[i%FINE];
    cum.push(cum[i-1]+Math.hypot(b[0]-a[0], b[1]-a[1]));
  }
  const total=cum[FINE];
  const OUT=Math.floor(n*0.26);
  const edge=[]; let j=0;
  for(let i=0;i<OUT;i++){
    const target=total*i/OUT;
    while(cum[j+1]<target) j++;
    const a=raw[j%FINE], b=raw[(j+1)%FINE];
    const seg=cum[j+1]-cum[j];
    const u=seg>0?(target-cum[j])/seg:0;
    edge.push([a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u]);
  }
  const SY=1.12;
  for(const p of edge){ p[0]/=16; p[1]=p[1]*SY/16; }
  const out=[];
  for(let i=0;i<OUT;i++) out.push({x:edge[i][0], y:edge[i][1], edge:true});
  for(let i=0;i<n-OUT;i++){
    const e=edge[(Math.random()*OUT)|0];
    const f=Math.sqrt(Math.random());
    out.push({x:e[0]*f, y:e[1]*f, edge:false});
  }
  for(const p of out){ p.x+=(Math.random()-0.5)*0.015; p.y+=(Math.random()-0.5)*0.015; }
  return out;
}
function sampleText(text,n,fitW,fitH,fontPx){
  const oc=document.createElement('canvas'), o=oc.getContext('2d');
  const font='900 '+fontPx+'px "PingFang SC","Microsoft YaHei","Hiragino Sans GB","Heiti SC","Noto Sans CJK SC",sans-serif';
  o.font=font;
  const w=Math.max(2,Math.ceil(o.measureText(text).width)+40);
  const h=Math.max(2,Math.ceil(fontPx*1.4)+40);
  oc.width=w; oc.height=h;
  o.font=font; o.fillStyle='#fff'; o.textAlign='center'; o.textBaseline='middle';
  o.fillText(text,w/2,h/2);
  const data=o.getImageData(0,0,w,h).data;
  const raw=[]; let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(let y=0;y<h;y+=2) for(let x=0;x<w;x+=2){
    if(data[(y*w+x)*4+3]>128){
      raw.push([x,y]);
      if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
    }
  }
  const scale=Math.min(fitW/Math.max(1,maxX-minX), fitH/Math.max(1,maxY-minY));
  const offX=cx-(minX+maxX)/2*scale, offY=cy-(minY+maxY)/2*scale;
  const out=[];
  if(raw.length<20){
    for(let i=0;i<n;i++) out.push({x:(Math.random()*2-1)*fitW/2+cx, y:(Math.random()*2-1)*fitH/2+cy});
    return out;
  }
  for(let i=0;i<n;i++){
    const p=raw.length?raw[(Math.random()*raw.length)|0]:[w/2,h/2];
    out.push({x:offX+p[0]*scale, y:offY+p[1]*scale});
  }
  return out;
}

/* ===================== 数据 ===================== */
let heartN=[], P=[], S=[], TASS=[];
let tasselBaseY=0;

function buildTextShapes(){ /* 520 目标在 buildParticles 内取（用于归一化 3D 变换） */ }
function buildHeart(){ heartN=sampleHeart(PARTICLE_COUNT); }
function sample520Norm(n){
  const q=sampleText('520', n, R*2.7, R*2.3, 320);
  const out=[];
  for(let i=0;i<n;i++) out.push({ x:(q[i].x-cx)/R, y:(q[i].y-cy)/R });
  return out;
}
function buildParticles(){
  P=[];
  const heart=heartN;
  const t520=sample520Norm(PARTICLE_COUNT);
  for(let i=0;i<PARTICLE_COUNT;i++){
    const h=heart[i], q=t520[i];
    const pink=Math.random()<0.46;
    const bokeh=Math.random()<0.06;               // 散景：前景大柔光（景深）
    // 520 形态：稀疏 + 柔边 + 外扩光晕（气流汇聚）
    let qx,qy,qfade;
    if(Math.random()<0.16){                        // 约 16% 化作外扩柔光晕
      const ang=Math.atan2(q.y,q.x)+(Math.random()-0.5)*0.6;
      const rad=Math.hypot(q.x,q.y)+0.12+Math.random()*0.22;
      qx=Math.cos(ang)*rad; qy=Math.sin(ang)*rad; qfade=0.30+Math.random()*0.20;
    }else{
      qx=q.x+(Math.random()-0.5)*0.035;            // 轻微抖动 → 边缘散开柔和
      qy=q.y+(Math.random()-0.5)*0.045;
      qfade=0.50+Math.random()*0.45;
    }
    P.push({
      bx:h.x, by:h.y, bz:((Math.random()*2-1)*0.32),
      qx:qx, qy:qy, qz:(Math.random()*2-1)*0.10,
      x:cx+(Math.random()*2-1)*W*0.45,
      y:-Math.random()*H*0.6-30,
      vx:(Math.random()-0.5)*0.6, vy:1.5+Math.random()*3.5,
      k:0.011+Math.random()*0.007,
      size: bokeh? (8+Math.random()*10) : (1.3+Math.random()*2.6),
      bright: bokeh? (0.22+Math.random()*0.18) : (h.edge? 0.85+Math.random()*0.35 : 0.30+Math.random()*0.22),
      edge:h.edge,
      bokeh:bokeh, qfade:qfade,
      spr: bokeh? (pink?bokehPink:bokehIce) : (pink?softPink:softIce),
      cross: !bokeh && (h.edge? Math.random()<0.08 : Math.random()<0.03),
      tw:Math.random()*6.28, ts:0.6+Math.random()*2.0,
      delay:Math.random()*1.1, delayDone:false,
      cz:0, csc:1
    });
  }
}
function buildStars(){
  S=[];
  for(let i=0;i<STAR_COUNT;i++){
    const pink=Math.random()<0.46;
    S.push({
      x:Math.random()*W, y:Math.random()*H,
      size:1.7+Math.random()*2.6,
      base:0.28+Math.random()*0.5,
      tw:Math.random()*6.28, ts:0.4+Math.random()*1.6,
      spr: pink?glyphPink:glyphIce,
      dot: pink?softPink:softIce,
      dx:(Math.random()-0.5)*0.05, dy:(Math.random()-0.5)*0.05
    });
  }
}
function buildTassel(){
  TASS=[];
  const N=Math.round(Math.min(1100, Math.max(420, R*4)));
  for(let i=0;i<N;i++){
    const rN=Math.pow(Math.random(),1.35);
    const pink=Math.random()<0.30;
    TASS.push({
      rN:rN, ang:Math.random()*6.283185,
      size:0.8+Math.random()*1.9,
      base:0.14+Math.random()*0.38,
      tw:Math.random()*6.283, ts:0.5+Math.random()*1.6,
      floatAmp:0.8+Math.random()*2.6,
      floatF:0.5+Math.random()*1.1,
      phase0:Math.random()*6.283,
      spr: pink?basePink:baseBand
    });
  }
  tasselBaseY = cy + 1.58*R;
}

/* ===================== 尺寸 / 初始化 ===================== */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  cx=W/2; cy=H/2;
  R=Math.min(W,H)*0.27;
  buildStars();
  buildTassel();
  makeOff();
}
function init(){
  PARTICLE_COUNT=Math.round(Math.min(8000,Math.max(3500,(window.innerWidth*window.innerHeight)/170)));
  resize();
  buildHeart();
  buildParticles();
  startTime=performance.now();
  requestAnimationFrame(frame);
}

/* ===================== 绘制（场景层，画在离屏 sceneCtx 上） ===================== */
function drawBottomGlow(){}
function drawHeartHalo(t){
  const br=1+0.025*Math.sin(t*0.9);
  g.globalAlpha=0.07;
  g.drawImage(halo, cx-R*1.7*br, cy-R*1.5*br, R*3.4*br, R*3.0*br);
  g.globalAlpha=1;
}
// 底座：更宽更扁的半透明流光带 + 缓缓向外扩散的波浪涟漪，绝无实线硬边。
function drawTassel(t){
  const br=1+0.025*Math.sin(t*0.9);
  const bob=Math.sin(t*0.6)*5;
  const targetBase=(mode==='heart'? cy+1.50*R*br : cy+1.34*R*br)+bob*0.5;
  tasselBaseY+=(targetBase-tasselBaseY)*0.06;
  const ez=Math.max(0,Math.min((zoom-1)/1.2,1));
  const ease=ez*ez*(3-2*ez);
  const dim=1-0.55*ease;
  const bx=cx, by=tasselBaseY;
  const RX=R*1.5, RY=RX*0.13;                   // 更宽、更扁

  // 外圈弥散光晕（粉+冰）
  g.globalAlpha=0.22*dim;
  g.drawImage(baseBand, bx-RX*1.5, by-RY*4.5, RX*3.0, RY*9.0);
  g.globalAlpha=0.15*dim*(0.85+0.15*Math.sin(t*1.1));
  g.drawImage(basePink, bx-RX*1.9, by-RY*5.5, RX*3.8, RY*11.0);

  // 流光带本体：极柔径向渐变，边缘溶解（无环线）
  g.save();
  g.translate(bx,by); g.scale(1,RY/RX);
  const bodyG=g.createRadialGradient(0,0,0,0,0,RX);
  bodyG.addColorStop(0.00,'rgba(255,214,234,0.20)');
  bodyG.addColorStop(0.30,'rgba(190,225,255,0.13)');
  bodyG.addColorStop(0.70,'rgba(140,200,255,0.06)');
  bodyG.addColorStop(1.00,'rgba(120,180,255,0)');
  g.globalAlpha=dim; g.fillStyle=bodyG;
  g.beginPath(); g.arc(0,0,RX,0,6.283185); g.fill();
  g.restore();

  // 缓缓向外扩散的柔和波纹（更多、更慢、更柔、无硬边）
  g.save();
  g.translate(bx,by); g.scale(1,RY/RX);
  const RINGS=7;
  for(let i=0;i<RINGS;i++){
    const ph=(t*0.10+i/RINGS)%1;
    const rr=RX*(0.06+0.94*ph);
    const a=Math.sin(Math.PI*ph)*0.10*dim;
    if(a<=0.012) continue;
    const rg=g.createRadialGradient(0,0,rr*0.5,0,0,rr);
    rg.addColorStop(0.00,'rgba(255,220,238,0)');
    rg.addColorStop(0.50,'rgba(210,235,255,0)');
    rg.addColorStop(0.88,'rgba(225,242,255,'+a.toFixed(3)+')');
    rg.addColorStop(1.00,'rgba(200,230,255,0)');
    g.globalAlpha=1; g.fillStyle=rg;
    g.beginPath(); g.arc(0,0,rr,0,6.283185); g.fill();
  }
  g.restore();

  // 横向缓缓流动的极光光带（让底座"活"起来）
  for(let i=0;i<3;i++){
    const sp=(t*0.06+i/3)%1;
    const sx=bx+(sp*2-1)*RX*0.9;
    const sy=by+Math.sin(t*0.5+i)*RY*0.35;
    const sa=0.07*dim*Math.max(0,Math.sin(Math.PI*sp));
    if(sa<=0.01) continue;
    g.globalAlpha=sa;
    g.drawImage(baseBand, sx-RX*0.5, sy-RY*1.2, RX, RY*2.4);
  }

  // 盘面微光粒子：闪烁 + 上下浮动 + 极轻角向漂移
  for(let i=0;i<TASS.length;i++){
    const s=TASS[i];
    const bobY=Math.sin(t*s.floatF+s.phase0)*s.floatAmp;
    const ang=s.ang+0.05*Math.sin(t*0.25+s.phase0);
    const tw=0.55+0.45*Math.sin(t*s.ts+s.tw);
    const edge=Math.pow(1-s.rN,1.15);
    const x=bx+Math.cos(ang)*s.rN*RX;
    const y=by+Math.sin(ang)*s.rN*RY+bobY;
    const a=s.base*tw*edge*dim;
    if(a<=0.02) continue;
    const sz=s.size*(0.9+0.3*tw);
    g.globalAlpha=Math.min(a,1);
    g.drawImage(s.spr, x-sz/2, y-sz/2, sz, sz);
  }
  g.globalAlpha=1;
}
function drawStars(t){
  const z=zoom;
  const lod=Math.max(0,Math.min((z-1)/1.05,1));
  const showDot = lod<0.985;
  const showGlyph= lod>0.015;
  for(let i=0;i<S.length;i++){
    const s=S[i];
    s.x+=s.dx; s.y+=s.dy;
    if(s.x<-14)s.x=W+14; else if(s.x>W+14)s.x=-14;
    if(s.y<-14)s.y=H+14; else if(s.y>H+14)s.y=-14;
    const tw=0.55+0.45*Math.sin(t*s.ts+s.tw);
    const a=s.base*tw;
    if(a<=0.02) continue;
    if(showDot){
      const da=a*(1-lod);
      if(da>0.02){
        const ds=s.size*(0.9+0.5*tw);
        g.globalAlpha=Math.min(da,1);
        g.drawImage(s.dot, s.x-ds/2, s.y-ds/2, ds, ds);
      }
    }
    if(showGlyph){
      const ga=Math.min(1, a*lod*1.35);
      if(ga>0.02){
        const gs=s.size*2.0*(0.9+0.3*tw);
        g.globalAlpha=ga;
        g.drawImage(s.spr, s.x-gs/2, s.y-gs/2, gs, gs);
      }
    }
  }
}
// 3D 体积爱心 / 520：柔和景深粒子 + 气流汇聚
function drawParticles(t,dtS){
  const ay=curYaw, ax=curPitch;
  const cY=Math.cos(ay), sY=Math.sin(ay);
  const cX=Math.cos(ax), sX=Math.sin(ax);
  const focal=4.2, zMax=1.05;
  const br=1+0.025*Math.sin(t*0.9);
  const bob=Math.sin(t*0.6)*5;
  const introFade=Math.min(1,t*1.2);
  const ez=Math.max(0,Math.min((zoom-1)/1.2,1));
  const ease=ez*ez*(3-2*ez);
  const mainDim=1-0.88*ease;
  for(let i=0;i<P.length;i++){
    const p=P[i];
    const px0=p.x, py0=p.y;
    let ox,oy,oz;
    if(mode==='heart'){ ox=p.bx; oy=p.by; oz=p.bz; }
    else { ox=p.qx; oy=p.qy; oz=p.qz; }
    const x1=ox*cY+oz*sY;
    const z1=-ox*sY+oz*cY;
    const y1=oy;
    const y2=y1*cX - z1*sX;
    const z2=y1*sX + z1*cX;
    const sc=focal/(focal - z2);
    let tx=cx + x1*sc*R*br;
    let ty=cy + y2*sc*R*br + bob;
    p.cz=z2; p.csc=sc;
    // 520 气流汇聚：边缘随角度与时间轻微涡动呼吸
    if(mode==='520'){
      const ang=Math.atan2(ty-cy, tx-cx);
      const wob=Math.sin(t*0.7 + ox*4 + oy*3)*0.022*R;
      tx+=Math.cos(ang+1.5708)*wob;
      ty+=Math.sin(ang+1.5708)*wob;
    }
    if(!p.delayDone){
      if(t<p.delay){
        p.vy+=0.08*dtS; p.x+=p.vx*dtS; p.y+=p.vy*dtS;
        if(p.y>H){ p.y=-20; p.x=cx+(Math.random()*2-1)*W*0.45; }
      }else p.delayDone=true;
    }
    if(p.delayDone){
      p.vx+=(tx-p.x)*p.k*dtS; p.vy+=(ty-p.y)*p.k*dtS;
      const vt=t-morphAt;
      if(vt<2.4){
        const vs=Math.exp(-vt*2.0)*dtS;
        const rx=p.x-cx, ry=p.y-cy;
        const inv=1/Math.max(40,Math.hypot(rx,ry));
        p.vx+=(-ry*inv)*vs*1.5;
        p.vy+=( rx*inv)*vs*1.5;
      }else if(mode==='heart'){
        const rx=p.x-cx, ry=p.y-cy;
        const inv=1/Math.max(30,Math.hypot(rx,ry));
        const sw=(0.06+0.04*Math.sin(t*0.5+p.tw))*dtS;
        p.vx+=(-ry*inv)*sw;
        p.vy+=( rx*inv)*sw;
      }
      const dmp=1-0.1*dtS;
      p.vx*=dmp; p.vy*=dmp; p.x+=p.vx*dtS; p.y+=p.vy*dtS;
    }
    const tw=0.55+0.45*Math.sin(t*p.ts+p.tw);
    const nf=Math.max(0,Math.min(1,(1-p.cz/zMax)*0.5));
    let a=p.bright*(0.45+0.55*tw)*introFade*mainDim*(0.55+0.45*nf);
    if(mode==='520') a*=p.qfade*1.15;             // 稀疏柔和（轻微亮度补偿）
    const sz=p.size*(0.85+0.4*tw)*p.csc;
    const sp=Math.hypot(p.x-px0, p.y-py0);
    if(sp>3.0 && i%2===0){                         // 快速运动时的瞬时拖尾光丝
      g.globalAlpha=Math.min(a*0.9,0.7);
      g.strokeStyle=(p.spr===softIce||p.spr===bokehIce)?'rgba(150,200,255,0.9)':'rgba(255,220,238,0.9)';
      g.lineWidth=Math.max(0.8,p.size*0.35);
      g.beginPath(); g.moveTo(px0,py0); g.lineTo(p.x,p.y); g.stroke();
    }
    g.globalAlpha=Math.min(a,1);
    g.drawImage(p.spr, p.x-sz/2, p.y-sz/2, sz, sz);
    if(p.cross && tw>0.62){
      const cs=p.size*1.9*p.csc;
      g.globalAlpha=Math.min(a*1.5,1);
      g.drawImage(crossSpr, p.x-cs/2, p.y-cs/2, cs, cs);
    }
  }
}

/* ===================== 背景 / 暗角（画在主画布上） ===================== */
function drawBackground(t){
  // 极暗深紫蓝宇宙深空
  const g0=ctx.createRadialGradient(cx,cy*0.9,0, cx,cy, Math.max(W,H)*0.78);
  g0.addColorStop(0,'rgba(24,20,46,1)');
  g0.addColorStop(0.5,'rgba(13,11,32,1)');
  g0.addColorStop(1,'rgba(6,5,16,1)');
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.fillStyle=g0; ctx.fillRect(0,0,W,H);
  // 极淡星云（粉 + 冰）
  ctx.globalCompositeOperation='lighter';
  const nb=0.5+0.5*Math.sin(t*0.15);
  ctx.globalAlpha=0.06*(0.7+0.3*nb);
  ctx.drawImage(basePink, cx-W*0.35, cy-H*0.30, W*0.7, H*0.7);
  ctx.globalAlpha=0.05*(0.7+0.3*(1-nb));
  ctx.drawImage(baseBand, cx-W*0.30, cy+H*0.08, W*0.6, H*0.6);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}
function drawVignette(){
  const g=ctx.createRadialGradient(cx,cy*0.92,Math.min(W,H)*0.22, cx,cy,Math.max(W,H)*0.74);
  g.addColorStop(0,'rgba(4,3,12,0)');
  g.addColorStop(1,'rgba(3,2,9,0.62)');
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

/* ===================== 主循环 ===================== */
let lastFrame=performance.now();
function frame(now){
  const t=(now-startTime)/1000;
  const dtS=Math.max(0.5,Math.min(3,(now-lastFrame)/16.667));  // 帧时间缩放：低帧率下物理进程与真实时间同步
  lastFrame=now;
  zoom+=(targetZoom-zoom)*0.08;
  curYaw  +=(tgtYaw  -curYaw  )*0.045;
  curPitch+=(tgtPitch-curPitch)*0.045;

  // 1) 深空背景
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBackground(t);

  // 2) 离屏场景：粒子 / 底座 / 星尘（加色混合）
  g=sceneCtx;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,sceneCv.width,sceneCv.height);
  g.setTransform(DPR,0,0,DPR,0,0);
  g.globalCompositeOperation='lighter';
  g.save();
  g.translate(cx,cy); g.scale(zoom,zoom); g.translate(-cx,-cy);
  drawHeartHalo(t);
  drawTassel(t);
  drawParticles(t,dtS);
  drawStars(t);
  g.restore();
  g.globalAlpha=1;

  // 3) Bloom 泛光：把场景降采样后多次模糊加色叠加到主画布
  bloomCtx.setTransform(1,0,0,1,0,0);
  bloomCtx.globalCompositeOperation='source-over';
  bloomCtx.globalAlpha=1;
  bloomCtx.clearRect(0,0,bloomCv.width,bloomCv.height);
  bloomCtx.drawImage(sceneCv,0,0,bloomCv.width,bloomCv.height);

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation='lighter';
  ctx.filter='blur(6px)';  ctx.globalAlpha=0.42; ctx.drawImage(bloomCv,0,0,W,H);
  ctx.filter='blur(16px)'; ctx.globalAlpha=0.26; ctx.drawImage(bloomCv,0,0,W,H);
  ctx.filter='none';

  // 4) 清晰场景叠回（保留颗粒与结构）
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=1;
  ctx.drawImage(sceneCv,0,0,W,H);

  // 5) 暗角
  drawVignette();

  requestAnimationFrame(frame);
}

/* ===================== 交互 ===================== */
function toggle(){
  mode=(mode==='heart')?'520':'heart';
  morphAt=(performance.now()-startTime)/1000;
  for(const p of P){
    const rx=p.x-cx, ry=p.y-(cy-40);
    const d=Math.max(24,Math.hypot(rx,ry));
    const b=5+Math.random()*8;
    const tg=(3+Math.random()*6)*(Math.random()<0.5?1:-1);
    p.vx+=(rx/d)*b+(-ry/d)*tg;
    p.vy+=(ry/d)*b*0.75+(rx/d)*tg-1.5;
  }
}
function clampZoom(){ if(targetZoom<0.6)targetZoom=0.6; if(targetZoom>4.2)targetZoom=4.2; }

canvas.addEventListener('wheel', (e)=>{
  e.preventDefault();
  targetZoom*=(e.deltaY<0)?1.12:0.89;
  clampZoom();
},{passive:false});

const ptr=new Map();
let pinchPrev=0, tap=null;
function pinchDist(){
  const a=[...ptr.values()];
  return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
}
canvas.addEventListener('pointerdown', (e)=>{
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===1) tap={x:e.clientX,y:e.clientY,t:performance.now()};
  if(ptr.size===2){ pinchPrev=pinchDist(); tap=null; }
  if(canvas.setPointerCapture){ try{canvas.setPointerCapture(e.pointerId);}catch(_){} }
});
canvas.addEventListener('pointermove', (e)=>{
  if(ptr.size<2){
    const nx=Math.max(-1,Math.min(1,(e.clientX-cx)/cx));
    const ny=Math.max(-1,Math.min(1,(e.clientY-cy)/cy));
    tgtYaw   = nx*MAXYAW;
    tgtPitch = ny*MAXPITCH;
  }
  if(!ptr.has(e.pointerId)) return;
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===2){
    const d=pinchDist();
    if(pinchPrev>0){ targetZoom*=d/pinchPrev; clampZoom(); }
    pinchPrev=d; tap=null;
  }
});
function ptrEnd(e){
  ptr.delete(e.pointerId);
  if(ptr.size<2) pinchPrev=0;
  if(tap && ptr.size===0){
    const dt=performance.now()-tap.t;
    const dx=e.clientX-tap.x, dy=e.clientY-tap.y;
    if(dt<300 && Math.hypot(dx,dy)<14) toggle();
  }
  if(ptr.size===0) tap=null;
}
canvas.addEventListener('pointerup', ptrEnd);
canvas.addEventListener('pointercancel', ptrEnd);
window.addEventListener('resize', ()=>{ resize(); buildHeart(); buildParticles(); });

init();
})();
</script>
